<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1926"/>
      <stop offset="100%" stop-color="#14121A"/>
    </linearGradient>

    <!-- Coral to Mint Accent Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#FF6B4A"/>
    </linearGradient>

    <!-- Mint Sparkle Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3DC"/>
      <stop offset="100%" stop-color="#83E6C9"/>
    </linearGradient>

    <!-- Glowing Drop Shadows -->
    <filter id="glowCoral" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6B4A" flood-opacity="0.45"/>
    </filter>
    <filter id="glowMint" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#83E6C9" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect width="180" height="180" rx="42" fill="url(#bgGrad)" stroke="#37324A" stroke-width="3"/>

  <!-- Interior Ambient Glow -->
  <circle cx="90" cy="90" r="65" fill="#FF6B4A" opacity="0.08"/>
  <circle cx="125" cy="55" r="35" fill="#83E6C9" opacity="0.12"/>

  <!-- Stylized Prompt Chevron Prompt Command Symbol ">" -->
  <path d="M48 52L86 90L48 128" 
        stroke="url(#coralGrad)" 
        stroke-width="15" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowCoral)"/>

  <!-- Terminal Cursor / Light-Table Bar "_" -->
  <path d="M96 128H132" 
        stroke="#EDE9F7" 
        stroke-width="14" 
        stroke-linecap="round"/>

  <!-- 4-Point AI Sparkle Star (Top Right) -->
  <path d="M128 42C128 53 137 62 148 62C137 62 128 71 128 82C128 71 119 62 108 62C119 62 128 53 128 42Z" 
        fill="url(#mintGrad)"
        filter="url(#glowMint)"/>

  <!-- Secondary Mini Sparkle Star -->
  <path d="M148 30C148 34.5 151.5 38 156 38C151.5 38 148 41.5 148 46C148 41.5 144.5 38 140 38C144.5 38 148 34.5 148 30Z" 
        fill="#EDE9F7" 
        opacity="0.9"/>
</svg>