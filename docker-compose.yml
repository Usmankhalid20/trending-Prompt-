services:
  redis:
    image: redis:7-alpine
    container_name: trending_prompts_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: Web GUI to inspect Redis cache keys
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: trending_prompts_redis_gui
    restart: always
    environment:
      - REDIS_HOSTS=redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  redis_data:
    driver: local
